name: Build NovaBoost Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to package'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package NovaBoost APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "=== Setting up Android SDK Environment ==="
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Locate sdkmanager
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager &> /dev/null; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            echo "Accepting all Android SDK licenses..."
            yes | "$SDKMANAGER" --licenses || true

            echo "Ensuring Android SDK Platform 36 and Build-Tools are installed..."
            "$SDKMANAGER" --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools" || true
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "Warning: sdkmanager not found, relying on Gradle auto-download."
          fi

      - name: Normalize Line Endings and Permissions
        run: |
          echo "=== Fixing line endings and permissions ==="
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew

      - name: Prepare Signing Keys and Environment Files
        run: |
          echo "=== Setting up Release Keystore and Environment ==="
          
          # Configure Release Keystore for assembleRelease
          RELEASE_KEYSTORE="$GITHUB_WORKSPACE/release.keystore"
          RELEASE_PASS="novaboostreleasepass"
          
          echo "KEYSTORE_PATH=$RELEASE_KEYSTORE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$RELEASE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$RELEASE_PASS" >> $GITHUB_ENV
          
          # Generate production-ready 2048-bit RSA signing key if not present
          if [ ! -s "$RELEASE_KEYSTORE" ]; then
            echo "Generating fresh self-signed release keystore for NovaBoost..."
            keytool -genkeypair -v \
              -keystore "$RELEASE_KEYSTORE" \
              -storepass "$RELEASE_PASS" \
              -alias upload \
              -keypass "$RELEASE_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NovaBoost,O=NovaBoost,C=US"
            echo "Generated release.keystore successfully."
          fi

          # Ensure debug.keystore is also ready as backup
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # Ensure .env and secrets file exists for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Copied .env from .env.example"
            else
              echo "GEMINI_API_KEY=" > .env
              echo "Created placeholder .env"
            fi
          fi
          touch secrets.properties

      - name: Build NovaBoost APK (assembleRelease)
        run: |
          echo "=== Assembling NovaBoost Release APK ==="
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Run Unit Tests
        run: |
          echo "=== Running Unit Tests ==="
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.workers.max=2

      - name: Package APK Artifacts
        run: |
          echo "=== Packaging NovaBoost APK ==="
          mkdir -p build-artifacts
          
          echo "Searching for generated APKs in app/build/outputs/..."
          find app/build/outputs -name "*.apk" -ls
          
          # Prioritize release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "build-artifacts/NovaBoost.apk"
          else
            # Grab first apk found
            APK_FOUND=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$APK_FOUND" ]; then
              cp "$APK_FOUND" "build-artifacts/NovaBoost.apk"
            fi
          fi

          # Verify that APK was created and has non-zero size
          if [ -f "build-artifacts/NovaBoost.apk" ]; then
            APK_SIZE=$(ls -lh "build-artifacts/NovaBoost.apk" | awk '{print $5}')
            echo "NovaBoost APK packaged successfully! Size: $APK_SIZE"
            sha256sum "build-artifacts/NovaBoost.apk" > "build-artifacts/SHA256SUMS.txt"
            cat "build-artifacts/SHA256SUMS.txt"
          else
            echo "ERROR: No APK found after assembleRelease!"
            exit 1
          fi

      - name: Upload NovaBoost APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-apk
          path: build-artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Output Job Summary
        run: |
          APK_SIZE=$(ls -lh build-artifacts/NovaBoost.apk | awk '{print $5}')
          APK_SHA256=$(awk '{print $1}' build-artifacts/SHA256SUMS.txt)
          echo "### 🚀 NovaBoost APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | NovaBoost — Ultimate Real Android Optimizer |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package File** | \`NovaBoost.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact Name** | \`NovaBoost-apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Variant** | Release (Pre-signed, Installable on all Android devices) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | Android 16 (API 36) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Minimum SDK** | Android 7.0+ (API 24+) |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Size** | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256** | \`$APK_SHA256\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📥 How to Download & Install:" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to the **Artifacts** section of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "2. Download **\`NovaBoost-apk\`** (ZIP archive containing \`NovaBoost.apk\` and \`SHA256SUMS.txt\`)." >> $GITHUB_STEP_SUMMARY
          echo "3. Extract the ZIP and open **\`NovaBoost.apk\`** on your Android device." >> $GITHUB_STEP_SUMMARY
          echo "4. Tap to install (enable *'Install unknown apps'* for your browser or file manager if prompted)." >> $GITHUB_STEP_SUMMARY
          echo "5. Open **NovaBoost** for 100% genuine real-time system diagnostics, hardware analytics, and performance tools!" >> $GITHUB_STEP_SUMMARY

